- defaults:
    link:
        create: true
        relink: true
        force: true
    shell:
        stdout: true
        stderr: true

- clean: ['~']

- link:
    ~/.hushlogin: .hushlogin
    ~/.gitconfig: git/.gitconfig
    ~/.git_template: git/.git_template
    ~/.gitignore_global: git/.gitignore_global
    ~/.zshenv: zsh/.zshenv
    ~/.zprofile: zsh/.zprofile
    ~/.zshrc: zsh/.zshrc
    ~/.config/nvim: nvim
    ~/.config/karabiner: karabiner
    ~/.config/kitty: kitty
    ~/Library/Application\ Support/lazygit/config.yml: lazygit/config.yml
    ~/.Brewfile: brewfile
    ~/.npmrc: npm/.npmrc
    ~/.aerospace.toml: aerospace/.aerospace.toml
    ~/.config/starship.toml: starship/starship.toml

- create:
    ~/projects:
    ~/.config/nvim/undo:
    ~/.ssh:
        mode: 0700
    ~/.ssh/sockets:
        mode: 0700

- shell:
    - description: Copying ssh config
      command: cp -n ssh/config ~/.ssh/config && chmod 600 ~/.ssh/config

    - description: Installing submodules
      command: git submodule update --init --recursive

    - description: Bootstrapping dotfiles
      command: ./scripts/bootstrap.sh

    - description: Sourcing macos defaults
      command: "source ~/.dotfiles/macos/.defaults"
