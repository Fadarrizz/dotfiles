# Font
font_family		          Victor Mono Medium
bold_font        	      Victor Mono Bold
italic_font      	      Victor Mono Medium Oblique
bold_italic_font 	      Victor Mono Bold Oblique
font_size                 14
# Nerd Fonts v2.3.3
symbol_map                U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono
disable_ligatures         cursor
# font_features             Iosevka +dlig cv94=3
spacing                   90

# Tabs
tab_bar_style             powerline
tab_powerline_style       angled
tab_title_template        "{title}"
tab_bar_filter            session:~ or session:^$
tab_bar_min_tabs          1

# Misc
adjust_line_height 	      160%
cursor_blink_interval 	  0
window_padding_width 	  10
hide_window_decorations   titlebar-only
enable_audio_bell 	      no
macos_option_as_alt       left
term                      xterm-kitty
scrollback_lines          10000
touch_scroll_multiplier   2.0
copy_on_select            yes
mouse_hide_wait           -1
allow_remote_control      yes
listen_on                 unix:/tmp/kitty
editor                    nvim
shell_integration         no-sudo
shell_integration         no-title
shell                     zsh --login
confirm_os_window_close   0

# Key Mappings
kitty_mod cmd+shift

map kitty_mod+m toggle_layout tall
map kitty_mod+z toggle_layout stack
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+\ launch --location=vsplit    --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=current

map ctrl+[ layout_action decrease_num_full_size_windows
map ctrl+] layout_action increase_num_full_size_windows
map ctrl+/ layout_action mirror toggle
map ctrl+y layout_action mirror true
map ctrl+n layout_action mirror false

map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down

map kitty_mod+h move_window right
map kitty_mod+l move_window left
map ctrl+k move_window down
map ctrl+j move_window up

map ctrl+f launch --type=overlay zsh -c "~/.dotfiles/bin/kitty-sessionizer"
map kitty_mod+e goto_session ~/.dotfiles/kitty/sessions/dotfiles.kitty-session

map cmd+t combine : launch --cwd=current --type=tab --tab-title=" " : set_tab_title

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
